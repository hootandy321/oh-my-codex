<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <text x="64" y="84" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="600" fill="#00A6A6">08 / 边界与风险</text>
  <text x="64" y="126" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="700" fill="#172033">当前能力可验证，但治理边界要继续收敛</text>
  <text x="64" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#4B5565">主动讲清楚风险，能避免把 RAF 和动态加载包装成超出当前边界的承诺。</text>

  <rect x="64" y="204" width="1152" height="396" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <rect x="64" y="204" width="1152" height="48" rx="8" fill="#FFF3EA"/>
  <rect x="64" y="244" width="1152" height="8" fill="#FFF3EA"/>
  <line x1="328" y1="204" x2="328" y2="600" stroke="#D8E0EA"/>
  <line x1="688" y1="204" x2="688" y2="600" stroke="#D8E0EA"/>
  <line x1="948" y1="204" x2="948" y2="600" stroke="#D8E0EA"/>
  <text x="88" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">风险或误解</text>
  <text x="352" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">当前处理</text>
  <text x="712" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">下一步治理</text>
  <text x="972" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">判断</text>

  <line x1="64" y1="339" x2="1216" y2="339" stroke="#D8E0EA"/>
  <line x1="64" y1="426" x2="1216" y2="426" stroke="#D8E0EA"/>
  <line x1="64" y1="513" x2="1216" y2="513" stroke="#D8E0EA"/>

  <rect x="88" y="279" width="44" height="28" rx="14" fill="#FFF3EA" stroke="#C2410C"/>
  <text x="101" y="299" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#C2410C">R1</text>
  <text x="148" y="288" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">任意代码插件误解</text>
  <text x="148" y="315" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">把动态 agent 误读为任意代码执行</text>
  <text x="352" y="284" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">Markdown prompt 与 TOML agent</text>
  <text x="352" y="311" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">配置加载，非 JS/TS 执行插件</text>
  <text x="712" y="284" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">单独评估 JS/TS 插件安全模型</text>
  <text x="712" y="311" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">权限、隔离、审计另立设计</text>
  <rect x="972" y="284" width="182" height="28" rx="14" fill="#FFF3EA"/>
  <text x="994" y="304" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#C2410C">边界需明确</text>

  <rect x="88" y="366" width="44" height="28" rx="14" fill="#FFF3EA" stroke="#C2410C"/>
  <text x="101" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#C2410C">R2</text>
  <text x="148" y="375" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">RAF 被误解为 PPT 工具</text>
  <text x="148" y="402" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">首个验证场景遮蔽通用方法</text>
  <text x="352" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">$raf-ppt</text>
  <text x="430" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">兼容入口，实际回到</text>
  <text x="352" y="398" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">通用 RAF 三阶段</text>
  <text x="712" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">沉淀代码、报告、研究等 routes</text>
  <text x="712" y="398" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">证明不是单一 artifact 流程</text>
  <rect x="972" y="371" width="182" height="28" rx="14" fill="#E8EEF5"/>
  <text x="994" y="391" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#1E3A5F">定位需强化</text>

  <rect x="88" y="453" width="44" height="28" rx="14" fill="#FFF3EA" stroke="#C2410C"/>
  <text x="101" y="473" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#C2410C">R3</text>
  <text x="148" y="462" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">新专家质量不稳定</text>
  <text x="148" y="489" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">角色提示词质量差异会放大</text>
  <text x="352" y="458" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">项目 scope 先试验，验证后再沉淀</text>
  <text x="352" y="485" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">不直接污染全局内置能力</text>
  <text x="712" y="458" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">建立提升内置标准</text>
  <text x="712" y="485" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">contract、测试、样例、回滚条件</text>
  <rect x="972" y="458" width="182" height="28" rx="14" fill="#E8EEF5"/>
  <text x="994" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#1E3A5F">需要制度化</text>

  <rect x="88" y="540" width="44" height="28" rx="14" fill="#FFF3EA" stroke="#C2410C"/>
  <text x="101" y="560" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#C2410C">R4</text>
  <text x="148" y="549" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">只停留文档层</text>
  <text x="148" y="576" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">看起来像方法论，没有交付闭环</text>
  <text x="352" y="545" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">本次 PPTX 闭环验证</text>
  <text x="352" y="572" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">源稿、spec、SVG、讲稿、导出</text>
  <text x="712" y="545" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">生成 ppt-master 项目和 editable PPTX</text>
  <text x="712" y="572" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#172033">用实际产物验证流程</text>
  <rect x="972" y="545" width="182" height="28" rx="14" fill="#E8F7F7"/>
  <text x="994" y="565" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#2E7D32">本轮可闭环</text>

  <text x="64" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">Evidence: dynamic agent config, not arbitrary code plugins</text>
  <text x="1190" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">08 / 09</text>
</svg>
