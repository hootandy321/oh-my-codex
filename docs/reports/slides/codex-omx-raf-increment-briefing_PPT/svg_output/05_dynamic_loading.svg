<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <text x="64" y="84" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="600" fill="#00A6A6">05 / 工程增量</text>
  <text x="64" y="126" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="700" fill="#172033">动态加载带来的扩展方式变化</text>
  <text x="64" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="600" fill="#1E3A5F">专家能力从“写死进源码”变成“项目级配置、刷新、验证、再沉淀”</text>

  <rect x="80" y="232" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="110" y="274" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#1E3A5F">项目级定义</text>
  <text x="110" y="316" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">.codex/prompts/*.md</text>
  <text x="110" y="342" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">.codex/agents/*.toml</text>

  <rect x="380" y="232" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="410" y="274" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#1E3A5F">用户级定义</text>
  <text x="410" y="316" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">~/.codex/prompts</text>
  <text x="410" y="342" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">~/.codex/agents</text>

  <rect x="680" y="232" width="228" height="132" rx="8" fill="#E8F7F7" stroke="#00A6A6" stroke-width="2"/>
  <text x="710" y="274" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#1E3A5F">刷新入口</text>
  <text x="710" y="316" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">omx agents refresh</text>
  <text x="710" y="342" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">同步为 native TOML</text>

  <rect x="980" y="232" width="220" height="132" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="1010" y="274" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#1E3A5F">OMX 路由</text>
  <text x="1010" y="316" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">专家参与 RAF</text>
  <text x="1010" y="342" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">而不是只存在文档里</text>

  <line x1="308" y1="298" x2="380" y2="298" stroke="#6B7A90" stroke-width="3"/>
  <polygon points="380,298 364,289 364,307" fill="#6B7A90"/>
  <line x1="608" y1="298" x2="680" y2="298" stroke="#6B7A90" stroke-width="3"/>
  <polygon points="680,298 664,289 664,307" fill="#6B7A90"/>
  <line x1="908" y1="298" x2="980" y2="298" stroke="#6B7A90" stroke-width="3"/>
  <polygon points="980,298 964,289 964,307" fill="#6B7A90"/>

  <rect x="118" y="440" width="1044" height="98" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <text x="152" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">管理价值</text>
  <text x="152" y="514" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">新专家先在项目中低成本试验，验证有效后再沉淀为通用能力，减少主线代码和发布节奏负担。</text>

  <rect x="118" y="568" width="1044" height="44" rx="8" fill="#FFF3EA" stroke="#C2410C"/>
  <text x="152" y="596" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#C2410C">边界：当前是 Markdown / TOML agent 配置加载，不是任意 JS / TS 代码插件执行。</text>

  <text x="64" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">Evidence: src/agents/registry.ts, src/cli/agents.ts, skills/agents-refresh/SKILL.md</text>
  <text x="1190" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">05 / 09</text>
</svg>
