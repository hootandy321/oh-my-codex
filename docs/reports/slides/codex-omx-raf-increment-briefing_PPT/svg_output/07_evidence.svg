<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <text x="64" y="84" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="600" fill="#00A6A6">07 / 实现证据</text>
  <text x="64" y="126" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="700" fill="#172033">这些判断已有实现证据支撑</text>
  <text x="64" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#4B5565">当前实现已经覆盖“模型定义、动态加载、刷新入口、测试保护、插件交付”。</text>

  <rect x="64" y="204" width="1152" height="394" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <rect x="64" y="204" width="1152" height="48" rx="8" fill="#E8EEF5"/>
  <rect x="64" y="244" width="1152" height="8" fill="#E8EEF5"/>
  <line x1="372" y1="204" x2="372" y2="598" stroke="#D8E0EA"/>
  <line x1="836" y1="204" x2="836" y2="598" stroke="#D8E0EA"/>
  <text x="88" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">管理判断</text>
  <text x="396" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">实现证据</text>
  <text x="860" y="235" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#1E3A5F">说明</text>

  <line x1="64" y1="318" x2="1216" y2="318" stroke="#D8E0EA"/>
  <line x1="64" y1="384" x2="1216" y2="384" stroke="#D8E0EA"/>
  <line x1="64" y1="450" x2="1216" y2="450" stroke="#D8E0EA"/>
  <line x1="64" y1="516" x2="1216" y2="516" stroke="#D8E0EA"/>

  <circle cx="94" cy="285" r="13" fill="#00A6A6"/>
  <path d="M88 285 L93 290 L101 280" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="279" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">RAF 不是口头概念</text>
  <text x="118" y="303" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">三阶段都有 contract</text>
  <text x="396" y="276" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">skills/goal-setting/SKILL.md</text>
  <text x="396" y="301" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">skills/architecture-spec/SKILL.md</text>
  <text x="860" y="288" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">目标、规格、实现闭环被拆成可审阅资产。</text>

  <circle cx="94" cy="351" r="13" fill="#00A6A6"/>
  <path d="M88 351 L93 356 L101 346" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="345" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">PPT route 已纳入通用 RAF</text>
  <text x="118" y="369" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">不是孤立的 PPT 工具</text>
  <text x="396" y="342" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">skills/raf-ppt/SKILL.md</text>
  <text x="396" y="367" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">skills/ralph-implement/SKILL.md</text>
  <text x="860" y="354" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">兼容入口保留，执行回到三阶段主路径。</text>

  <circle cx="94" cy="417" r="13" fill="#00A6A6"/>
  <path d="M88 417 L93 422 L101 412" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="411" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">专家能力可动态刷新</text>
  <text x="118" y="435" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">项目级定义进入 native agent</text>
  <text x="396" y="408" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">src/agents/registry.ts</text>
  <text x="396" y="433" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">src/cli/agents.ts</text>
  <text x="860" y="420" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">从源码内置，转向配置、刷新、验证后沉淀。</text>

  <circle cx="94" cy="483" r="13" fill="#00A6A6"/>
  <path d="M88 483 L93 488 L101 478" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="477" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">关键契约有测试保护</text>
  <text x="118" y="501" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">防止路径退化</text>
  <text x="396" y="474" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">raf-ppt-skill-contract.test.ts</text>
  <text x="396" y="499" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">catalog generator tests</text>
  <text x="860" y="486" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">避免 `$ppt-master` 被误打包或绕过 RAF。</text>

  <circle cx="94" cy="549" r="13" fill="#00A6A6"/>
  <path d="M88 549 L93 554 L101 544" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="543" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#172033">插件交付保持轻量</text>
  <text x="118" y="567" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#4B5565">外部依赖按需解析</text>
  <text x="396" y="540" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">ensure-ppt-master-skill.sh</text>
  <text x="396" y="565" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#172033">docs/recipes/raf-ppt-ppt-master-dependency.md</text>
  <text x="860" y="552" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#4B5565">GitHub 仓库轻量，Bitbucket 依赖失败可诊断。</text>

  <rect x="64" y="620" width="1152" height="28" rx="14" fill="#E8F7F7"/>
  <text x="92" y="640" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#1E3A5F">结论：管理判断可以回到具体 contract、入口、测试和交付文档，而不是只依赖口头叙述。</text>

  <text x="64" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">Evidence: RAF skills, dynamic agent registry, refresh CLI, contract tests, dependency recipe</text>
  <text x="1190" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">07 / 09</text>
</svg>
