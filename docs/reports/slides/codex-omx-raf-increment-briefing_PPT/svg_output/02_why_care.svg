<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <text x="64" y="84" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="600" fill="#00A6A6">02 / 问题定义</text>
  <text x="64" y="126" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="700" fill="#172033">为什么上级需要关心</text>
  <text x="64" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="600" fill="#1E3A5F">复杂任务的主要风险不是做不出来，而是快速产出一个偏离真实目标的结果</text>

  <line x1="160" y1="332" x2="1120" y2="332" stroke="#D8E0EA" stroke-width="4"/>
  <polygon points="1120,332 1102,322 1102,342" fill="#D8E0EA"/>

  <rect x="86" y="238" width="300" height="236" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <circle cx="236" cy="282" r="26" fill="#FFF3EA" stroke="#C2410C" stroke-width="2"/>
  <text x="222" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="26" font-weight="700" fill="#C2410C">1</text>
  <text x="128" y="338" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="700" fill="#1E3A5F">目标没有冻结</text>
  <text x="118" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">执行中根据局部上下文</text>
  <text x="118" y="414" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">不断漂移，最后难以判定</text>
  <text x="118" y="442" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">什么才算真正完成</text>

  <rect x="490" y="238" width="300" height="236" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <circle cx="640" cy="282" r="26" fill="#FFF3EA" stroke="#C2410C" stroke-width="2"/>
  <text x="626" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="26" font-weight="700" fill="#C2410C">2</text>
  <text x="532" y="338" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="700" fill="#1E3A5F">视角没有反推</text>
  <text x="522" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">只满足实现者视角，</text>
  <text x="522" y="414" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">未覆盖甲方、受众、评审</text>
  <text x="522" y="442" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">和后续维护需要</text>

  <rect x="894" y="238" width="300" height="236" rx="8" fill="#FFFFFF" stroke="#D8E0EA"/>
  <circle cx="1044" cy="282" r="26" fill="#FFF3EA" stroke="#C2410C" stroke-width="2"/>
  <text x="1030" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="26" font-weight="700" fill="#C2410C">3</text>
  <text x="936" y="338" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="700" fill="#1E3A5F">失败只局部修补</text>
  <text x="926" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">问题没有回到目标或规格层，</text>
  <text x="926" y="414" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#4B5565">返工不可复用，评估也困难</text>

  <rect x="220" y="548" width="840" height="58" rx="8" fill="#E8F7F7" stroke="#00A6A6"/>
  <text x="260" y="584" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#1E3A5F">RAF 的价值：把这些风险前置成目标、规格、验证三类控制点</text>

  <text x="64" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">Evidence: goal-setting / architecture-spec / ralph-implement skill contracts</text>
  <text x="1190" y="674" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#7A869A">02 / 09</text>
</svg>
